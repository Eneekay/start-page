<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start</title>
<meta name="description" content="Personal browser start page.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css?v=8" rel="stylesheet">
</head>
<body>

<canvas id="network-canvas" aria-hidden="true"></canvas>
<div class="dot-grid" aria-hidden="true"></div>
<div class="blob blob-1" aria-hidden="true"></div>
<div class="blob blob-2" aria-hidden="true"></div>
<div class="blob blob-3" aria-hidden="true"></div>

<div class="dashboard" id="dashboard">

  <div class="dash-columns">

    <div class="dash-col">
      <section class="widget clockgreeting-widget glass">
        <div class="greeting-slot" id="greetingWidget" aria-live="polite"></div>
        <div class="clock" id="clock">00:00:00</div>
        <div class="date" id="date">&nbsp;</div>
      </section>

      <section class="widget weather-widget glass">
        <span class="widget-eyebrow">Weather</span>
        <div class="weather-body" id="weatherBody">
          <div class="widget-status">Locating…</div>
        </div>
      </section>
    </div>

    <div class="dash-col">
      <section class="widget fact-widget glass">
        <div class="fact-section">
          <div class="fact-section-header">
            <span class="widget-eyebrow">Science Fact</span>
            <button type="button" class="fact-refresh" id="scienceFactRefresh" aria-label="Show another science fact">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 0 1 15.3-6.3L21 8"></path>
                <path d="M21 3v5h-5"></path>
                <path d="M21 12a9 9 0 0 1-15.3 6.3L3 16"></path>
                <path d="M3 21v-5h5"></path>
              </svg>
            </button>
          </div>
          <p class="fact-text" id="scienceFactText">&nbsp;</p>
        </div>
        <div class="fact-section-divider"></div>
        <div class="fact-section">
          <div class="fact-section-header">
            <span class="widget-eyebrow">Animal Fact</span>
            <button type="button" class="fact-refresh" id="animalFactRefresh" aria-label="Show another animal fact">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 0 1 15.3-6.3L21 8"></path>
                <path d="M21 3v5h-5"></path>
                <path d="M21 12a9 9 0 0 1-15.3 6.3L3 16"></path>
                <path d="M3 21v-5h5"></path>
              </svg>
            </button>
          </div>
          <p class="fact-text" id="animalFactText">&nbsp;</p>
        </div>
      </section>

      <section class="widget onthisday-widget glass" id="onThisDayWidget"></section>

      <section class="widget puzzle-widget glass" id="puzzleWidget"></section>
    </div>

    <div class="dash-col">
      <section class="widget calendar-widget glass">
        <span class="widget-eyebrow">Calendar</span>
        <div class="calendar-nav">
          <button type="button" class="calendar-nav-btn" id="calPrevBtn" aria-label="Previous month">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <span class="calendar-month-label" id="calMonthLabel">&nbsp;</span>
          <button type="button" class="calendar-nav-btn" id="calNextBtn" aria-label="Next month">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
        <div class="calendar-weekdays" id="calWeekdays"></div>
        <div class="calendar-grid" id="calGrid"></div>
        <div class="calendar-nameday" id="calNameday">
          <span class="cal-date-label" id="calDateLabel">Today</span>
          <span id="calNamedayNames">—</span>
        </div>
      </section>

      <section class="widget bankholiday-widget glass">
        <span class="widget-eyebrow">Next UK Bank Holiday</span>
        <div class="bankholiday-name" id="bankHolidayName">—</div>
        <div class="bankholiday-date" id="bankHolidayDate">&nbsp;</div>
        <div class="bankholiday-countdown" id="bankHolidayCountdown">&nbsp;</div>
      </section>

      <section class="widget countdown-widget glass">
        <span class="widget-eyebrow">Next Event</span>
        <div id="countdownBody"></div>
      </section>
    </div>

  </div>

  <nav class="widget tools-dock glass" aria-label="Quick links">

    <a class="tool-tile" href="https://mail.google.com/" target="_blank" rel="noopener">
      <span class="tool-tile-icon glass">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2"></rect>
          <path d="M3.5 6.5L12 13l8.5-6.5"></path>
        </svg>
      </span>
      <span class="tool-tile-label">Gmail</span>
    </a>

    <a class="tool-tile" href="https://claude.ai/" target="_blank" rel="noopener">
      <span class="tool-tile-icon glass">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <path d="M12 2.5l2.1 6.4 6.4 2.1-6.4 2.1L12 19.5l-2.1-6.4-6.4-2.1 6.4-2.1L12 2.5z"></path>
        </svg>
      </span>
      <span class="tool-tile-label">Claude AI</span>
    </a>

    <a class="tool-tile" href="https://gemini.google.com/" target="_blank" rel="noopener">
      <span class="tool-tile-icon glass">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8L12 3l6 5-6 13-6-13z"></path>
          <path d="M6 8h12M9.2 8l2.8 13 2.8-13"></path>
        </svg>
      </span>
      <span class="tool-tile-label">Gemini AI</span>
    </a>

    <a class="tool-tile" href="https://onedrive.live.com/" target="_blank" rel="noopener">
      <span class="tool-tile-icon glass">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7.5 18h9.8a3.7 3.7 0 0 0 .5-7.37 5 5 0 0 0-9.55-1.6A3.7 3.7 0 0 0 7.5 18z"></path>
        </svg>
      </span>
      <span class="tool-tile-label">OneDrive</span>
    </a>

    <a class="tool-tile" href="https://drive.google.com/" target="_blank" rel="noopener">
      <span class="tool-tile-icon glass">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.5l8.5 14.7H3.5L12 3.5z"></path>
        </svg>
      </span>
      <span class="tool-tile-label">Google Drive</span>
    </a>

    <a class="tool-tile" href="https://ground.news/" target="_blank" rel="noopener">
      <span class="tool-tile-icon glass">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20V11M9.5 20V6M15 20V13.5M20 20V8"></path>
        </svg>
      </span>
      <span class="tool-tile-label">Ground News</span>
    </a>

    <a class="tool-tile" href="https://news.google.com/" target="_blank" rel="noopener">
      <span class="tool-tile-icon glass">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4.5h12.5v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-14z"></path>
          <path d="M16.5 8.5H19a1 1 0 0 1 1 1V18a2 2 0 0 1-2 2"></path>
          <path d="M7 8.5h6.5M7 11.5h6.5M7 14.5h4"></path>
        </svg>
      </span>
      <span class="tool-tile-label">Google News</span>
    </a>

  </nav>

</div>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/facts.js?v=8"></script>
<script src="js/animal-facts.js?v=8"></script>
<script src="js/languages.js?v=8"></script>
<script src="js/namedays.js?v=8"></script>
<script src="js/onthisday.js?v=8"></script>
<script src="js/app.js?v=8"></script>
</body>
</html>
